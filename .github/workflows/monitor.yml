name: Job Monitor

on:
  schedule:
    - cron: "*/10 * * * *"   # every 10 minutes, 24/7 - runs on GitHub's infrastructure, not your laptop
  workflow_dispatch: {}       # lets you trigger a run manually from the Actions tab

permissions:
  contents: write

concurrency:
  group: job-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run monitoring cycle
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -m job_monitor.main

      - name: Commit updated data + dashboard
        run: |
          git config user.name "job-monitor-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/jobs.db docs/index.html
          if ! git diff --cached --quiet; then
            git commit -m "chore: monitoring run $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
          else
            echo "No changes to commit."
          fi
